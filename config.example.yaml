# ResumeTap · 配置示例
#
# 本软件为纯 AI 驱动：分数、等级、优缺点全部由你配置的模型产出。
# 应用首次启动会在 %APPDATA%\ResumeGacha\config.yaml 生成默认配置，
# 也可以把本文件内容复制过去（注意填写你自己的 api_key）。

# ============================================================
# AI 评估（必需）
# ============================================================
llm:
  enabled: true                     # 必须勾选并填 api_key 才可用
  base_url: https://api.openai.com/v1   # 任何 OpenAI 兼容端点
  api_key: "sk-your-key-here"
  model: gpt-4o-mini
  temperature: 0.2
  timeout: 90                       # 单次请求超时（秒）
  auto_start: true                  # 导入后自动开始评估；false = 手动点"开始评估"

# ============================================================
# 目标岗位（必填；空值表示尚未选择）
# ============================================================
# 内置岗位：backend 后端 / frontend 前端 / fullstack 全栈 / data 数据分析
#   algorithm 算法 / test 测试 / ops 运维 / security 安全风控
#   product 产品 / designer UI / ux 交互 / marketing 市场 / operations 运营
#   sales 销售 / customer_service 客服 / media 媒体 / hr 人力 / finance 财务
#   legal 法务 / engineering 机械硬件 / manufacturing 制造 / supply_chain 供应链
#   logistics 物流 / civil 建筑 / medical 医疗 / education 教师 / general 通用
#   auto = 让 AI 自行判断最匹配的岗位
role: backend

# 列表里没有的岗位：把 role 设为 custom，并填下面两项
custom_role:
  label: ""
  keywords: []

# ============================================================
# 筛选规则（会写进提示词，由 AI 判断是否满足）
# ============================================================
screening:
  min_score: 60           # 综合分低于此值视为不满足
  min_years: 2            # 工作年限下限
  required_degree: ""     # 不限 / 大专 / 本科 / 硕士 / 博士
  must_keywords: []       # 必须命中的关键词
  reject_keywords: []     # 出现即淘汰（如 外包、劳务派遣）

# ============================================================
# 稀有度阈值（由本地按分数换算，不采信模型返回值）
# ============================================================
rarity:
  ssr: 82
  sr: 66
  labels:
    SSR: 特级 · 传说
    SR: 高级 · 史诗
    R: 普通 · 稀有

# 额外关键词：仅用于评分提示词补充（可选）
keywords: []
jd_text: ""

# ============================================================
# 界面
# ============================================================
ui:
  theme: light
  view: list
  sound: true
  animation: true

# ============================================================
# 对外审查 API（默认关闭，供外部 AI / Agent 读写）
# ============================================================
api:
  enabled: false
  port: 8765

# ============================================================
# 隐私
# ============================================================
privacy:
  # true：保存简历原文（重新评估、查看原文需要它）
  # false：只保留解析结果，之后无法重新评估
  store_raw_text: true
